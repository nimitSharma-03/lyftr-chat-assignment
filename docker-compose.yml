services:
  backend:
    build:
      context: ./backend
    image: lyftr-chat-backend
    container_name: lyftr-chat-backend
    env_file:
      - path: .env
        required: false
    environment:
      LLM_API_KEYS: ${LLM_API_KEYS:-mock-demo-key-1,mock-demo-key-2}
      LLM_MODEL: ${LLM_MODEL:-gemini/gemini-2.5-flash}
      LLM_KEY_MODELS: ${LLM_KEY_MODELS:-}
      DATABASE_URL: ${DATABASE_URL:-sqlite:////data/app.db}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}
      ENABLE_FAILURE_SIMULATION: ${ENABLE_FAILURE_SIMULATION:-true}
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}
      KEY_COOLDOWN_SECONDS: ${KEY_COOLDOWN_SECONDS:-30}
      LLM_TIMEOUT_SECONDS: ${LLM_TIMEOUT_SECONDS:-30}
    ports:
      - "8000:8000"
    volumes:
      - chat-data:/data
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:8000}
    image: lyftr-chat-frontend
    container_name: lyftr-chat-frontend
    environment:
      API_URL: ${VITE_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  chat-data:
